name: Source health check

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC (off the hour to dodge the scheduler rush)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate the registry
        run: python -m unittest tests.test_registry

      - name: Check every source
        run: python scripts/check_sources.py | tee health-report.txt

      - name: Add the report to the run summary
        run: |
          echo '## Source health' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat health-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data/health.json
        run: |
          git config user.name 'health-check'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/health.json
          if git diff --cached --quiet; then
            echo 'No change.'
          else
            git commit -m 'Daily source health check'
            git push
          fi
