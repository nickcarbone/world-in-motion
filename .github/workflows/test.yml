name: Tests

on:
  push:
    paths-ignore:
      - 'data/health.json'
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python tests (registry, health checker)
        run: python -m unittest discover -s tests -v

      - name: JavaScript tests (curation, freshness, parsing)
        run: node --test tests/logic.test.mjs
